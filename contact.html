<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Weather Now</title>
  <link rel="stylesheet" href="Assets/style.css">
  <style>
    body {
      background: linear-gradient(135deg, rgba(30, 60, 114, 0.85), rgba(42, 82, 152, 0.85)),
                  url('images/Weather.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .confirmation-message {
      color: #4CAF50;
      margin-top: 20px;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h1>Contact Us</h1>
    <p>If you have any questions or suggestions about Weather Now, feel free to reach out using the form below.</p>

    <form class="contact-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p class="confirmation-message" id="confirmationMessage">Thank you for your message! We will get back to you soon.</p>

    <table id="messagesTable" style="display: none;">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="messagesTableBody"></tbody>
    </table>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.querySelector('.contact-form');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const messageInput = document.getElementById('message');
      const table = document.getElementById('messagesTable');
      const tableBody = document.getElementById('messagesTableBody');
      const confirmationMessage = document.getElementById('confirmationMessage');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const message = messageInput.value.trim();

        if (name && email && message) {
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${name}</td>
            <td>${email}</td>
            <td>${message}</td>
          `;
          tableBody.appendChild(row);
          table.style.display = 'table'; 

          
          nameInput.value = '';
          emailInput.value = '';
          messageInput.value = '';

          
          confirmationMessage.style.display = 'block';

    
          setTimeout(() => {
            confirmationMessage.style.display = 'none';
          }, 5000);
        }
      });
    });
  </script>

</body>
</html>
