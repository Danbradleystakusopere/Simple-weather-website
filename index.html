<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Now</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Assets/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, rgba(30, 60, 114, 0.85), rgba(42, 82, 152, 0.85)),
                  url('images/Weather.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="wrapper">
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="images/Weather.jpg" alt="Weather Icon" style="width: 80px;" />
    </div>

    <header class="header">
      <h1>Weather Now</h1>
      <p>Your daily weather companion</p>
    </header>

    <section class="search-section">
      <form id="searchForm" autocomplete="off">
        <input type="text" id="cityInput" placeholder="Enter city name..." required />
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="quote" style="text-align: center; font-style: italic; color: #ccc;">
      <p>"Wherever you go, no matter what the weather, always bring your own sunshine."</p>
    </section>

    <section class="weather-display" id="weatherDisplay">
      <div class="weather-box">
        <h2 class="city-name">--</h2>
        <img id="weatherIcon" src="images/Weather.jpg" alt="Weather Icon" />
        <p class="temperature">-- °C</p>
        <p class="description">--</p>
        <p class="humidity-value">Humidity: --%</p>
        <p class="wind-value">Wind: -- m/s</p>
      </div>
    </section>
  </div>

  <div class="loader" id="loader" style="display: none;">
    <div class="spinner"></div>
  </div>

  <script src="Assets/index.js"></script>
</body>
</html>
